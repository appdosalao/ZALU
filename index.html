    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#820AD1">

    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png">
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">
    <meta name="msapplication-TileColor" content="#820AD1">

    <!-- Theme-color dinâmico: segue o tema ativo (feminino/masculino/dark) -->
    <script>
      (function () {
        var DEFAULT_COLOR = '#820AD1';
        var update = function () {
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          var tileMeta = document.querySelector('meta[name="msapplication-TileColor"]');
          var color = DEFAULT_COLOR;
          try {
            var bg = getComputedStyle(document.documentElement)
              .getPropertyValue('--background')
              .trim();
            if (bg) color = 'hsl(' + bg + ')';
          } catch (e) {}
          if (themeMeta) themeMeta.setAttribute('content', color);
          if (tileMeta) tileMeta.setAttribute('content', color);
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', update);
        } else {
          update();
        }
        new MutationObserver(update).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme', 'class'],
        });
      })();
    </script>


    <meta property="og:title" content="ZALU — Sistema de Gestão" />
