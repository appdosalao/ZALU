name: Dependency Review

on:
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - uses: actions/dependency-review-action@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

