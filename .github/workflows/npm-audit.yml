name: NPM Audit

on:
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

